
name: Build ZODIAC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: zodiac-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check project files
        shell: bash
        run: |
          set -e
          echo "Checking ZODIAC project..."
          for file in main.py zodiac_data.py ui_components.py; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing required file: $file"
              exit 1
            fi
          done
          if [ ! -d assets ]; then
            echo "::error::Missing assets directory"
            exit 1
          fi
          echo "Project files found."

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            python3-pip python3-venv \
            build-essential \
            autoconf automake libtool \
            pkg-config zlib1g-dev \
            libncurses5-dev libffi-dev \
            libssl-dev cmake \
            libltdl-dev

      - name: Setup Buildozer
        shell: bash
        run: |
          python3 -m venv .buildenv
          . .buildenv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.36

      - name: Create Buildozer configuration
        shell: bash
        run: |
          if [ ! -f buildozer.spec ]; then
            cat > buildozer.spec <<'EOF'
          [app]
          title = ZODIAC
          package.name = zodiac
          package.domain = com.zodiac
          source.dir = .
          source.include_exts = py,png,jpg,jpeg,kv,atlas,ttf,otf,svg,json
          version = 2.0.0
          requirements = python3,kivy,arabic-reshaper,python-bidi
          orientation = portrait
          fullscreen = 0
          android.permissions =
          android.api = 35
          android.minapi = 23
          android.archs = arm64-v8a, armeabi-v7a
          android.accept_sdk_license = True
          android.debug_artifact = apk

          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF
          fi

          echo "Buildozer configuration:"
          cat buildozer.spec

      - name: Build ZODIAC APK
        shell: bash
        run: |
          set -eux

          . .buildenv/bin/activate

          unset CC
          unset CXX
          unset CPP
          unset CFLAGS
          unset CXXFLAGS
          unset LDFLAGS

          export CC=clang
          export CXX=clang++

          echo "Compiler versions:"
          clang --version
          clang++ --version

          echo "Starting ZODIAC build..."
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: ZODIAC-Android-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

