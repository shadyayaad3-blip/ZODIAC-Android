name: Build ZODIAC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: zodiac-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check project files
        shell: bash
        run: |
          set -e
          echo "Checking ZODIAC project..."

          for file in main.py zodiac_data.py ui_components.py; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing required file: $file"
              exit 1
            fi
          done

          if [ ! -d assets ]; then
            echo "::error::Missing assets directory"
            exit 1
          fi

          if [ ! -f buildozer.spec ]; then
            echo "::error::buildozer.spec is missing"
            exit 1
          fi

          echo "Project files found."

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            python3-pip python3-venv \
            build-essential \
            autoconf automake libtool \
            pkg-config zlib1g-dev \
            libncurses5-dev libffi-dev \
            libssl-dev cmake \
            libltdl-dev

      - name: Setup Python build environment
        shell: bash
        run: |
          set -e

          python3 -m venv .buildenv
          source .buildenv/bin/activate

          python -m pip install --upgrade \
            pip setuptools wheel

          pip install \
            buildozer==1.5.0 \
            cython==0.29.36

          echo "Build environment:"
          python --version
          buildozer --version
          cython --version

      - name: Verify Android configuration
        shell: bash
        run: |
          set -e

          echo "Checking buildozer.spec..."

          grep -E '^(requirements|android.api|android.minapi|android.ndk|android.archs|p4a.branch)[[:space:]]*=' buildozer.spec

          grep -Eq '^android.archs[[:space:]]*=[[:space:]]*arm64-v8a[[:space:]]*$' buildozer.spec || {
            echo "::error::Architecture must be arm64-v8a"
            exit 1
          }

          grep -Eq '^android.ndk[[:space:]]*=[[:space:]]*25c[[:space:]]*$' buildozer.spec || {
            echo "::error::Android NDK must be 25c"
            exit 1
          }

          echo "Android configuration verified."

      - name: Build ZODIAC APK
        shell: bash
        run: |
          set -eux

          source .buildenv/bin/activate

          unset CC
          unset CXX
          unset CPP
          unset CFLAGS
          unset CXXFLAGS
          unset LDFLAGS

          echo "Starting ZODIAC Android build..."

          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: ZODIAC-Android-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
